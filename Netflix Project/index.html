<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>clone-Netflix</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="box"></div>
          <nav>
            <img src="assets/logo.svg" alt="logo" height="35px" width="200px">
        <div>
            <button class="btn">English
             <select>
                <option>all</option>
             </select>
            </button>
            <button class="btn-sign">Sign-in</button>
        </div>
          </nav>
           <div class="content">
            <span>Unlimited movies, TV shows, and more</span>
            <span>Starts at ₹149. Cancel at any time.</span>
            <span>Ready to watch? Enter your email to create or restart your membership.</span>

        <span class="search">
            <input type="text" placeholder="Email Address">
            <button class="btn-start">Get started ></button>
           </span>

        </div>

         <!-- trending now section -->
          <div class="container">
            <div class="section-title">
                Trending now
            </div>
             <div class="slider">
                <div class="card">
                    <img src="assets/background-netflix1_img.jpg" alt="image 1">
                    <div class="number">1</div>
                </div>
                <div class="card">
                    <img src="assets/background-netflix2_img.jpg" alt="image 2">
                    <div class="number">2</div>
                </div>
                <div class="card">
                    <img src="assets/background-netflix3_img.jpg" alt="image 3">
                    <div class="number">3</div>
                </div>
                <div class="card">
                    <img src="assets/background-netflix4_img.jpg" alt="image 4">
                    <div class="number">4</div>
                </div>
                <div class="card">
                    <img src="assets/background-netflix5_img.jpg" alt="image 5">
                    <div class="number">5</div>
                </div>
                <div class="card">
                    <img src="assets/background-netflix6_img.jpg" alt="image 6">
                    <div class="number">6</div>
                </div>    
                <div class="card">
                    <img src="assets/background-netflix7_img.jpg" alt="image 7">
                    <div class="number">7</div>
                </div>   
                <div class="card">
                    <img src="assets/background-netflix8_img.jpg" alt="image 8">
                    <div class="number">8</div>
                </div> 
                <div class="card">
                    <img src="assets/background-netflix9_img.jpg" alt="image 9">
                    <div class="number">9</div>
                </div> 
                <div class="card">
                    <img src="assets/background-netflix10_img.jpg" alt="image 10">
                    <div class="number">10</div>
                </div> 
    
            </div>   
    </header>
</body>
</html>
